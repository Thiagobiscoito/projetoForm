  <body>
    <div class="container">
      <div class="cabecalho">
        <img class="user" src="/img/usuario.png" alt="Usuário" />
        <h1>Cadastro de Usuário</h1>
      </div>

      <p id="mensagens" class="mensagens"></p>
      <form class="formData" id="formData">
        <div class="campos">
          <label for="Nome"
            >*Nome:
            <span class="campoObrigatorio" id="campoObrigatorio"
              >(Campo obrigatorio)</span
            ></label
          >

          <input type="text" id="nome" placeholder="Digite seu nome" />
        </div>

        <div class="campos">
          <label for="E-mail">Email:</label>
          <input
            type="text"
            name="Email"
            id="email"
            placeholder="Digite seu E-mail"
          />
        </div>
        <button>
          <img src="/img/criar.png" alt="Criar" />
        </button>
      </form>

      <table class="tabelaUsuarios">
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Opções</th>
        </tr>
